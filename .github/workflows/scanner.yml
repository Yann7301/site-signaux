name: Scanner Crypto 24h/24

on:
  schedule:
    # Exécution automatique au début de chaque heure
    - cron: '0 * * * *'
  workflow_dispatch: # Permet de déclencher le scan manuellement depuis GitHub

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy ccxt resend

      - name: Exécuter le scanner crypto
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python bot.py

